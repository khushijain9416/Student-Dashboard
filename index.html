<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard">
        <h1>Student Dashboard</h1>
        <p class="subtitle">Student records at a glance</p>

        <div class="actions">
            <button id="showBtn">Show Students</button>
            <button id="addBtn">Add Student</button>
            <button id="themeBtn">Change Theme</button>
        </div>

        <p id="message" aria-live="polite"></p>

        <div id="studentContainer" class="student-list">
            <p class="empty-message">
                Click "Show Students" to view the records.
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
